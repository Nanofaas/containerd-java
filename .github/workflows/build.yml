name: build

on:
  push:
    branches: [master]
    # A release version is published from a tag, never from a push: GitHub Packages
    # will not accept the same version twice, so a push-triggered publish would fail
    # on the second commit. Pushes to master still build and test.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # GitHub Packages remains available for published dependencies. The companion libcni-java
  # snapshot is built from an immutable revision below until it is published.
  packages: read

jobs:
  unit:
    name: build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: containerd-java

      - name: Check out the companion libcni-java snapshot
        uses: actions/checkout@v7
        with:
          repository: Nanofaas/libcni-java
          ref: b0d0484970fba0f1d38e1983be67a6bb0e73e3cd
          path: libcni-java

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Also validates the Gradle wrapper jar against the published checksums.
      - uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: containerd-java

      - name: Install the companion libcni-java snapshot
        working-directory: libcni-java
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: Build and run unit tests
        working-directory: containerd-java
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: containerd-java/build/reports/tests/test
          retention-days: 7

  integration:
    name: integration tests + native image (real containerd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: containerd-java

      - name: Check out the companion libcni-java snapshot
        uses: actions/checkout@v7
        with:
          repository: Nanofaas/libcni-java
          ref: b0d0484970fba0f1d38e1983be67a6bb0e73e3cd
          path: libcni-java

      # GraalVM rather than a plain JDK: it is a JDK 25 like any other for the integration tests,
      # and it also carries native-image, so one job covers both without installing containerd twice.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: containerd-java

      - name: Install the companion libcni-java snapshot
        working-directory: libcni-java
        run: ./gradlew publishToMavenLocal --stacktrace

      # The runner ships containerd 1.7.x with Docker. This library targets the 2.x API and is
      # pinned to a specific version in build.gradle.kts, so install exactly that one rather
      # than testing against an API the vendored protos do not match. Reading the pin from the
      # build file keeps the two from drifting apart.
      - name: Install pinned containerd and runc
        # Reads the pinned version out of the build file, so it runs from the project directory.
        working-directory: containerd-java
        run: |
          set -euo pipefail
          version="$(grep -oP 'val containerdApiVersion = "v\K[0-9.]+' build.gradle.kts)"
          echo "installing containerd ${version} (pin from build.gradle.kts)"

          curl -fsSL -o containerd.tar.gz \
            "https://github.com/containerd/containerd/releases/download/v${version}/containerd-${version}-linux-amd64.tar.gz"
          sudo tar -C /usr/local -xzf containerd.tar.gz

          runc_version=v1.3.4
          curl -fsSL -o runc "https://github.com/opencontainers/runc/releases/download/${runc_version}/runc.amd64"
          sudo install -m 755 runc /usr/local/sbin/runc

          # Docker's containerd 1.7 holds the default socket; stop it so 2.x owns the path.
          sudo systemctl stop docker.socket docker.service containerd.service || true

          sudo mkdir -p /etc/containerd
          /usr/local/bin/containerd config default | sudo tee /etc/containerd/config.toml > /dev/null
          sudo /usr/local/bin/containerd --log-level warn &

          for _ in $(seq 1 30); do
            [ -S /run/containerd/containerd.sock ] && break
            sleep 1
          done
          sudo /usr/local/bin/ctr version
          # The socket is root-owned; the runner user needs it for the tests below.
          sudo chmod 666 /run/containerd/containerd.sock

      - name: Run integration tests
        working-directory: containerd-java
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew integrationTest --stacktrace

      # The integration tests skip themselves via JUnit Assumptions when containerd is not
      # reachable. Without this the job would go green having run nothing at all.
      - name: Fail if integration tests were skipped or did not run
        working-directory: containerd-java
        run: |
          set -euo pipefail
          results=build/test-results/integrationTest
          [ -d "$results" ] || { echo "::error::no integration test results at $results"; exit 1; }
          total=$(grep -ho 'tests="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          skipped=$(grep -ho 'skipped="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "integration tests: ${total} run, ${skipped} skipped"
          [ "$total" -gt 0 ] || { echo "::error::no integration tests ran"; exit 1; }
          [ "$skipped" -eq 0 ] || { echo "::error::${skipped} integration tests skipped (containerd unreachable?)"; exit 1; }

      # The metadata this library ships is only correct if an image built from it actually runs.
      # Compiling proves nothing on its own: the first attempt here built cleanly and then died on
      # the first exec, because JNR generated its native stubs at runtime.
      # CNI is a separate download and needs root to create bridges and move interfaces between
      # namespaces, so these tests live in their own task rather than skipping inside the main one
      # — a skip there is meant to mean something went wrong.
      - name: Install CNI plugins and a bridge network
        run: |
          set -euo pipefail
          version=v1.9.1
          arch=$(dpkg --print-architecture)
          curl -fsSL -o cni.tgz \
            "https://github.com/containernetworking/plugins/releases/download/${version}/cni-plugins-linux-${arch}-${version}.tgz"
          sudo mkdir -p /opt/cni/bin /etc/cni/net.d
          sudo tar -xzf cni.tgz -C /opt/cni/bin
          # Three networks, because the scenarios are about the differences between them:
          # routed without DNS, routed with DNS, and isolated with neither.
          sudo tee /etc/cni/net.d/10-nanofaas.conflist > /dev/null <<'JSON'
          {
            "cniVersion": "1.0.0",
            "name": "nanofaas-test",
            "plugins": [
              {"type": "bridge", "bridge": "cni-nanofaas0", "isGateway": true, "ipMasq": true,
               "ipam": {"type": "host-local", "ranges": [[{"subnet": "10.99.0.0/16"}]],
                        "routes": [{"dst": "0.0.0.0/0"}]}},
              {"type": "firewall", "backend": "iptables"},
              {"type": "loopback"}
            ]
          }
          JSON
          sudo tee /etc/cni/net.d/20-dnstest.conflist > /dev/null <<'JSON'
          {
            "cniVersion": "1.0.0",
            "name": "dns-test",
            "plugins": [
              {"type": "bridge", "bridge": "cni-dns0", "isGateway": true, "ipMasq": true,
               "ipam": {"type": "host-local", "ranges": [[{"subnet": "10.98.0.0/16"}]],
                        "routes": [{"dst": "0.0.0.0/0"}]},
               "dns": {"nameservers": ["10.98.0.1", "1.1.1.1"], "search": ["nanofaas.local"],
                       "domain": "nanofaas.local"}},
              {"type": "firewall", "backend": "iptables"},
              {"type": "loopback"}
            ]
          }
          JSON
          sudo tee /etc/cni/net.d/30-isolated.conflist > /dev/null <<'JSON'
          {
            "cniVersion": "1.0.0",
            "name": "nanofaas-isolated",
            "plugins": [
              {"type": "bridge", "bridge": "cni-isolated0", "isGateway": true,
               "ipam": {"type": "host-local", "ranges": [[{"subnet": "10.97.0.0/16"}]]}},
              {"type": "firewall", "backend": "iptables"},
              {"type": "loopback"}
            ]
          }
          JSON

      - name: Run the CNI networking tests
        working-directory: containerd-java
        # Root, and a Gradle home of its own so it does not take ownership of the runner user's.
        # Keep credentials and resolve the companion snapshot from the runner's Maven repository.
        run: sudo -E ./gradlew -g /tmp/gradle-root -Dmaven.repo.local="$HOME/.m2/repository" cniIntegrationTest --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Root still writes its test results and generated sources into build/, and every later step
      # runs as the runner user, which then cannot even delete them. Always, so that a failing CNI
      # run does not also take the report upload down with it.
      - name: Give the build directory back to the runner user
        if: always()
        working-directory: containerd-java
        run: sudo chown -R "$(id -u):$(id -g)" build .gradle

      # The CNI tests skip themselves when the plugins, the socket or the network config are not
      # there. All three are installed above, so a skip means one of those steps quietly did not
      # work — and the task would still be green having tested nothing.
      - name: Fail if the CNI tests were skipped or did not run
        working-directory: containerd-java
        run: |
          set -euo pipefail
          results=build/test-results/cniIntegrationTest
          [ -d "$results" ] || { echo "::error::no CNI test results at $results"; exit 1; }
          total=$(grep -ho 'tests="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          skipped=$(grep -ho 'skipped="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "CNI tests: ${total} run, ${skipped} skipped"
          [ "$total" -gt 0 ] || { echo "::error::no CNI tests ran"; exit 1; }
          [ "$skipped" -eq 0 ] || { echo "::error::${skipped} CNI tests skipped"; exit 1; }

      - name: Build the example as a native image
        working-directory: containerd-java
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew nativeCompile --stacktrace

      - name: Run the native image against containerd
        working-directory: containerd-java
        run: |
          set -euo pipefail
          binary=build/native/nativeCompile/containerd-java-example
          [ -x "$binary" ] || { echo "::error::$binary was not produced"; exit 1; }
          output=$("$binary" 2>&1) || { echo "$output"; echo "::error::the native image failed"; exit 1; }
          echo "$output"
          # It exits 0 even if it silently skipped the interesting part, so check what it did.
          grep -q "exec stdout=hello from containerd" <<<"$output" \
            || { echo "::error::the native image ran but did not exec inside a container"; exit 1; }

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: containerd-java/build/reports/tests/integrationTest
          retention-days: 7

  publish:
    name: publish to GitHub Packages
    # Only once both jobs agree the library works, and only for a tag: a package is not
    # something to take back. The `cni` publication resolves libcni-java from the
    # companion build, so the same pinned revision the tests validated is what ships.
    needs: [unit, integration]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Write rather than read, and only here: the workflow-level grant stays read.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: containerd-java

      - name: Check out the companion libcni-java snapshot
        uses: actions/checkout@v7
        with:
          repository: Nanofaas/libcni-java
          ref: b0d0484970fba0f1d38e1983be67a6bb0e73e3cd
          path: libcni-java

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: containerd-java

      - name: Install the companion libcni-java snapshot
        working-directory: libcni-java
        run: ./gradlew publishToMavenLocal --stacktrace

      # Before the upload, not after: publishing 0.22.0 under the tag v0.21.0 would
      # spend a version number on the wrong build, and a version is not reusable.
      - name: Check the tag matches the version in the build
        working-directory: containerd-java
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -oP '^version = "\K[^"]+' build.gradle.kts)"
          if [ -z "$version" ]; then
            echo "could not read the version from build.gradle.kts" >&2
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in build.gradle.kts" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $version"

      - name: Publish
        working-directory: containerd-java
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --stacktrace
